[tool.coverage.run]
branch = true
source = [ "ocr_service" ]

[tool.coverage.report]
exclude_lines = [ "if TYPE_CHECKING:" ]
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-report html:'../../coverage/apps/ocr-service/html'
 --cov-report xml:'../../coverage/apps/ocr-service/coverage.xml'
 --html='../../reports/apps/ocr-service/unittests/html/index.html'
 --junitxml='../../reports/apps/ocr-service/unittests/junit.xml'
"""

[tool.hatch.build.targets.wheel]
packages = [ "ocr_service" ]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
exclude = [ ".ruff_cache", ".svn", ".tox", ".venv", "dist" ]
line-length = 88
indent-width = 4

  [tool.ruff.lint]
  select = [ "E", "F", "UP", "B", "SIM", "I" ]
  ignore = [ ]
  fixable = [ "ALL" ]
  unfixable = [ ]

[project]
name = "ocr-service"
version = "1.0.0"
description = "Automatically generated by Nx."
requires-python = ">=3.12,<4"
readme = "README.md"
dependencies = [
  "pymupdf>=1.24",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
]

[build-system]
requires = [ "hatchling" ]
build-backend = "hatchling.build"
