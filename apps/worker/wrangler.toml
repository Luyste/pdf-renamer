name = "renamer-worker"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Persists the structured JSON logs (worker + client-log + container) in
# Workers Logs so a requestId can be traced after the fact.
[observability]
enabled = true

# Serves apps/web's Vite build output as static assets alongside the API routes.
# apps/web's build target must output here so a single `wrangler deploy` ships both.
[assets]
directory = "../web/dist"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "renamer-storage"

# R2 key layout — the PDF is stored exactly once, under staging/. Everything
# else is a small JSON pointer, never a duplicate copy of the file:
#   staging/{batchId}/{fileId}.pdf   — the only copy of the actual PDF bytes
#   parsed/{batchId}/{fileId}.json   — cached OCR result, for reload rehydration
#   processed/{sha256}.json          — cross-batch "already processed" record
#
# R2 lifecycle rules are not expressible in wrangler.toml. As configured on
# the bucket (check with `wrangler r2 bucket lifecycle list renamer-storage`):
#   staging/    expires after 7 days  — an unfinished batch older than a week
#                                       loses its PDFs and reloads as empty
#   parsed/     expires after 30 days
#   processed/  no expiry rule — records are tiny and exist to outlive any
#               one batch; add one if duplicate detection should forget
# Rules are added with the positional form (name, then prefix), e.g.:
#   wrangler r2 bucket lifecycle add renamer-storage \
#     renamer-storage-parsed parsed/ --expire-days 30
#
# These are a safety net for batches nobody explicitly deletes — DELETE
# /api/batch/:batchId (see routes/batch.ts) removes staging/ and parsed/ for a
# batch immediately when the user confirms cleanup in the UI.
# processed/ is deliberately left alone by that endpoint too.

[[containers]]
image = "../ocr-service/Dockerfile"
class_name = "OcrContainer"
instance_type = "standard-1"
max_instances = 1

[[durable_objects.bindings]]
name = "OCR_CONTAINER"
class_name = "OcrContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["OcrContainer"]

# The entire Worker must sit behind Cloudflare Access, allow-listing exactly one
# email address. Configure the Access application + policy in the Cloudflare
# dashboard (Zero Trust) or via Terraform — not here, and not in application code.
