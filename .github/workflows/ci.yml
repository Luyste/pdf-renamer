name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # nx affected needs history to diff against

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: astral-sh/setup-uv@v10.0.1

      - run: bun install --frozen-lockfile

      # Installs the shared uv workspace venv, including the root
      # [dependency-groups].dev tools (ruff, pytest) that ocr-service's
      # lint/test targets shell out to — without this they're never
      # installed on a fresh checkout and fail with "Failed to spawn".
      - run: uv sync

      # ocr-service has one test that OCRs a real scan; it is skipped, not
      # failed, when Tesseract is missing, so install it to actually run it.
      - run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends tesseract-ocr tesseract-ocr-hun

      - uses: nrwl/nx-set-shas@v4

      - name: Lint, test, build affected projects
        run: bunx nx affected -t lint test build --parallel=3
